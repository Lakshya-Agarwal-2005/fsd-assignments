<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verdant - houseplant care tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌿</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <a href="/" class="logo"><span aria-hidden="true">🌿</span> Verdant</a>
      <button class="btn primary" id="addBtn" type="button">Add a plant</button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" aria-live="polite">
      <div>
        <p class="date" id="today"></p>
        <h1 id="headline">Checking on your plants</h1>
        <p class="sub" id="subline">Loading your collection from the database.</p>
        <button class="btn water" id="waterAllBtn" type="button" hidden>Water all thirsty plants</button>
      </div>
      <dl class="summary">
        <div><dt>Plants</dt><dd id="sumPlants">0</dd></div>
        <div><dt>Need water today</dt><dd id="sumThirsty">0</dd></div>
        <div><dt>Rooms</dt><dd id="sumRooms">0</dd></div>
      </dl>
    </section>

    <section class="controls" aria-label="Filter plants">
      <div class="rooms" id="roomTabs" role="group" aria-label="Room"></div>
      <div class="control-row">
        <input type="search" id="search" placeholder="Search by name or species" aria-label="Search plants" />
        <label class="sort">Sort
          <select id="sort">
            <option value="thirsty">Thirstiest first</option>
            <option value="name">Name</option>
            <option value="newest">Recently added</option>
          </select>
        </label>
      </div>
    </section>

    <section class="plants" id="plants" aria-label="Your plants"></section>
  </main>

  <footer class="foot wrap">
    <p>Verdant stores every plant in MongoDB through four REST APIs: POST, GET, PUT and DELETE on <code>/api/plants</code>.</p>
  </footer>

  <!-- Add / edit form -->
  <dialog id="plantDialog" aria-labelledby="formTitle">
    <form id="plantForm" method="dialog" novalidate>
      <div class="dialog-head">
        <h2 id="formTitle">Add a plant</h2>
        <button type="button" class="icon-btn" id="closeDialog" aria-label="Close">✕</button>
      </div>

      <fieldset class="icons">
        <legend>Pick an icon</legend>
        <div id="iconPicker"></div>
      </fieldset>

      <div class="grid2">
        <label>Name<input name="name" required maxlength="40" placeholder="Monty" /><span class="err" data-for="name"></span></label>
        <label>Species<input name="species" maxlength="60" placeholder="Monstera deliciosa" /><span class="err" data-for="species"></span></label>
      </div>
      <div class="grid2">
        <label>Room<select name="room" id="roomSelect"></select><span class="err" data-for="room"></span></label>
        <label>Light<select name="light" id="lightSelect"></select><span class="err" data-for="light"></span></label>
      </div>
      <div class="grid2">
        <label>Water every (days)<input name="waterEveryDays" type="number" min="1" max="60" required placeholder="7" /><span class="err" data-for="waterEveryDays"></span></label>
        <label>Last watered<input name="lastWatered" type="date" required /><span class="err" data-for="lastWatered"></span></label>
      </div>
      <label>Notes<textarea name="notes" rows="2" maxlength="200" placeholder="Anything to remember about this plant"></textarea><span class="err" data-for="notes"></span></label>

      <p class="form-error" id="formError" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Add plant</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button type="button" id="toastAction" hidden></button>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
